# Example Nginx site: serves the built web app and proxies the API to Gunicorn/Django.
server {
    listen 443 ssl http2;
    server_name school.example.ug;

    ssl_certificate     /etc/letsencrypt/live/school.example.ug/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/school.example.ug/privkey.pem;

    client_max_body_size 20m;   # photos, receipts, CSV imports

    root /srv/school/frontend/dist;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location ~ ^/(api|admin)/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /static/ { alias /srv/school/backend/staticfiles/; }
    location /media/  { alias /srv/school/backend/media/; }

    # Client-side routes (e.g. /learners/12, /verify/<token>) fall back to the app.
    location / {
        try_files $uri /index.html;
    }
}
